rail: fedwire
display_name: Fedwire Funds Service
operator: Federal Reserve Financial Services
jurisdiction: US
type: rtgs

facts:
  operating_hours:
    opens_et: "21:00"
    opens_on: preceding calendar day
    customer_transfer_cutoff_et: "18:45"
    bank_transfer_cutoff_et: "19:00"
    closes_et: "19:00"
    business_days_only: true
    note: >-
      Closed Saturdays, Sundays and Federal Reserve Bank holidays. Online
      nonvalue messages begin at 20:35 ET on the preceding calendar day.
    status: verified
    # URL updated 2026-10-06; the old /wires/operating-hours.html path 301s
    # here. Every figure in this block re-read on the new page and unchanged.
    source: https://www.frbservices.org/resources/financial-services/wires/fedwire-funds-service-national-settlement-service-operating-hours/
    verified_on: 2026-10-06

  operating_days_announced_change:
    # Recorded for the same reason the 2027 Same Day ACH increase is: anything
    # designed against the current business-days-only assumption has a known
    # expiry. Leaving it out while recording the ACH one was inconsistent.
    change: Sunday through Friday, including weekday holidays
    supersedes: Monday through Friday, business days only
    daily_hours_unchanged: 22
    effective_from: null
    effective_note: >-
      No earlier than 2028. The Board says implementation will come no earlier
      than 2028 to allow operational and industry readiness, and has not given a
      date, so this is recorded without one rather than with a guess.
    status: verified
    source: https://www.federalreserve.gov/newsevents/pressreleases/other20251009a.htm
    verified_on: 2026-10-06

  message_standard:
    value: ISO 20022
    migration_completed: 2025-07-14
    status: verified
    # Source replaced 2026-10-06. The previous citation, the Fedwire ISO 20022
    # FAQ overview and implementation details page, now returns 404 with no
    # redirect. The 14 July day survives on the FRFS format FAQ, which states
    # that "the implementation of ISO 20022 on July 14, 2025, enabled Fedwire
    # Funds Service participants to apply the CPMI data model". The FRFS press
    # release of 15 July 2025 announces the completed migration but gives no
    # day, which is why it is not the citation here.
    source: https://www.frbservices.org/resources/financial-services/wires/fedwire-services-frequently-asked-questions/fedwire-service-iso-20022-faq/format-faq/
    verified_on: 2026-10-06

  settlement_finality:
    final_on_settlement: true
    irrevocable: true
    operator_obliged_to_cancel_on_request: false
    operator_obliged_to_forward_request: only if the Reserve Bank accepts the cancellation or amendment message
    status: verified
    note: >-
      Quoted from the Board: the Federal Reserve Banks provide the Fedwire Funds
      Service, "a real-time gross settlement system that enables participants to
      initiate funds transfer that are immediate, final, and irrevocable once
      processed". Operating Circular 6 section 8.1.4 supplies the recourse half:
      notwithstanding section 4A-211 of Article 4A a Reserve Bank has no
      obligation to cancel or amend a payment order even if it receives a
      request for return, and its only obligation to forward arises "if such a Message seeking to
      cancel or amend a payment order is accepted by a Reserve Bank", and
      the participant sending it may itself be liable under 4A-211 unless the
      request states "NO INDEMNITY". So the operator has no obligation to
      unwind a mistaken wire, which is not the same as saying it never can:
      what the circular removes is the duty, leaving the outcome to 4A-211
      between the participants.
    # Source caveat worth knowing before leaning on this page for anything else.
    # It carries the finality sentence but is otherwise old: it still cites a
    # 2008 participant count, and the Board last updated it on 2024-06-25. The
    # sentence is used because it describes how the service is designed rather
    # than reporting a figure, and because the hours it also gives match the
    # FRFS operating-hours page cited above exactly. Do not take a number off
    # it without checking FRFS.
    source: https://www.federalreserve.gov/paymentsystems/fedfunds_about.htm
    recourse:
      # Nested so the key is literally `source:` and the checker monitors it.
      source: https://www.frbservices.org/wp-content/uploads/010526-operating-circular-6.pdf
    verified_on: 2026-10-06

  per_transaction_value_limit:
    value_usd: 9999999999.99
    status: verified
    note: >-
      Quoted from the operator's own Fedwire Funds Service disclosure:
      "Participants can send up to one penny less than $10 billion in a single
      transaction." So the ceiling is $9,999,999,999.99, stated exactly.
      Recording the history because it is the better lesson. This field first
      said no primary source stated any limit, while the file cited a Board
      release three fields above saying "up to $10 billion". Corrected to that
      figure, the gap was then narrowed to "the exact maximum is unconfirmed",
      which was also wrong: the operator publishes it to the cent in its service
      disclosure. A file whose whole premise is that every value carries its
      source missed a published value twice.
    source: https://www.frbservices.org/binaries/content/assets/crsocms/financial-services/wires/funds-service-disclosure.pdf
    verified_on: 2026-10-07

# No gaps. The per-transaction limit was the only one and it is closed: the
# operator states it to the cent in the service disclosure cited above.
