rail: ach
display_name: ACH (Automated Clearing House)
operator: Nacha (rules), FedACH and EPN (operators)
jurisdiction: US
type: batch

facts:
  same_day_transaction_limit:
    value_usd: 1000000
    effective_from: 2022-03-18
    status: verified
    source: https://www.nacha.org/million
    verified_on: 2026-10-06

  same_day_transaction_limit_announced_increase:
    value_usd: 10000000
    effective_from: 2027-09-17
    status: verified
    note: >-
      Announced, not yet in force. Anything designed against the current
      $1,000,000 ceiling has a known expiry.
    source: https://www.nacha.org/rules/increasing-same-day-ach-dollar-limit-10-million-0
    verified_on: 2026-10-06

  same_day_settlement_windows:
    value: 3
    fedach_submission_deadlines_et:
      - "10:30"
      - "14:45"
      - "16:45"
    status: verified
    note: >-
      Deadlines are the FedACH schedule. An originating institution's own cutoff
      is earlier, often by hours, and that is the one that breaks your launch.
    # URL updated 2026-10-06. FRFS restructured frbservices.org and the old
    # /resources/resource-centers/same-day-ach/fedach-processing-schedule.html
    # path now 301s here. The table itself is unchanged and still carries
    # "effective September 12, 2022".
    source: https://www.frbservices.org/resources/resource-centers/same-day-ach-resource-center/fedach-processing-schedule/
    verified_on: 2026-10-06

gaps:
  - field: standard_ach_transaction_limit
    reason: >-
      Widely repeated as "no per-transaction limit", but no primary Nacha or FRFS
      page reviewed states that explicitly. Recorded as unverified rather than
      asserted. If you need this for a design decision, read the Nacha Operating
      Rules directly or ask your ODFI in writing.
    narrowed_by: >-
      Two primary sentences get close without closing it. Nacha, at
      nacha.org/million, states that entries over $1,000,000 submitted to a
      same-day window "will not be rejected by the ACH Operator, but will be
      processed for next-day settlement in the next available processing
      window". The ACH Operator itself goes further and names a figure: in
      Example 6 of the FedACH Same Day ACH sample scenarios, linked below, a
      file carrying a single PPD debit entry for $1,025,500 is processed, and
      "the debit entry for $1,025,500, however, exceeds the $1,000,000 same day
      ACH entry limit, so it will settle the next day". So standard ACH
      demonstrably carries a specific entry above the same-day cap, stated by
      the operator rather than inferred. Neither sentence establishes that no
      limit exists, so the gap stands. Quote Example 6 and not Example 1 on
      that page: Example 1's setup says the large credit is $1,000,000 and its
      outcome calls the same entry $1,100,000, so it cannot be relied on.
    searched: https://www.frbservices.org/resources/financial-services/fedach-services-resources/ach-faq/same-day-ach-sample-scenarios-effective-march-18-2022/
