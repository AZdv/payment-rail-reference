rail: ach
display_name: ACH (Automated Clearing House)
operator: Nacha (rules), FedACH and EPN (operators)
jurisdiction: US
type: batch

facts:
  same_day_transaction_limit:
    value_usd: 1000000
    effective_from: 2022-03-18
    status: verified
    source: https://www.nacha.org/million
    verified_on: 2026-10-06

  same_day_transaction_limit_announced_increase:
    value_usd: 10000000
    effective_from: 2027-09-17
    status: verified
    note: >-
      Announced, not yet in force. Anything designed against the current
      $1,000,000 ceiling has a known expiry.
    source: https://www.nacha.org/rules/increasing-same-day-ach-dollar-limit-10-million-0
    verified_on: 2026-10-06

  same_day_settlement_windows:
    value: 3
    fedach_submission_deadlines_et:
      - "10:30"
      - "14:45"
      - "16:45"
    status: verified
    note: >-
      Deadlines are the FedACH schedule. An originating institution's own cutoff
      is earlier, often by hours, and that is the one that breaks your launch.
    # URL updated 2026-10-06. FRFS restructured frbservices.org and the old
    # /resources/resource-centers/same-day-ach/fedach-processing-schedule.html
    # path now 301s here. The table itself is unchanged and still carries
    # "effective September 12, 2022".
    source: https://www.frbservices.org/resources/resource-centers/same-day-ach-resource-center/fedach-processing-schedule/
    verified_on: 2026-10-06

  settlement_finality:
    # Not one question. Interbank settlement of a credit item is final at the
    # settlement time. A debit item is not. The entry sitting on top of either
    # is a third thing again, and collapsing the three is how a design ends up
    # treating an ACH credit as being as unrecallable as a wire. Note these are
    # credit items and debit items, not two legs of one transfer: both types
    # generate debits and credits.
    scope: interbank settlement under Operating Circular 4
    credit_item_settlement_final: true
    final_at: settlement time in the FedACH Processing Schedule on the settlement date
    debit_item_settlement_reversible: true
    entry_level_recourse:
      reversing_entry_availability_banking_days: 5
      # Nested so the key is literally `source:` and the checker's
      # ^\s*(?:source|searched): regex monitors it. A sibling key such as
      # recourse_source: is silently skipped.
      source: https://www.nacha.org/rules/reversals-and-enforcement
    status: verified_partial
    note: >-
      Quoted from Operating Circular 4 paragraph 11.2: credit given by the
      Reserve Bank that holds the receiving bank's settlement account for a
      credit item "is final and available for use" at the settlement time
      provided in the FedACH Processing Schedule on the settlement date.
      Paragraph 11.1(b) is the other half. If a Reserve Bank has not received
      actually and finally collected funds for all debit items that settled on
      the immediately prior banking day by 12:00 p.m. ET, the Reserve Banks may,
      by no later than 5:30 p.m. ET that day, reverse the debits and credits for
      the debit items, and the circular is explicit that they reverse every
      debit item that settled in the same settlement window rather than the one
      that failed. So a credit item is final at settlement, while a settled
      debit item can still be unwound the following banking day, and not alone.
      All of that is interbank settlement under OC 4, which does not establish
      every EPN or customer-level rule.
      Entry-level recourse is a separate layer and part of it is public. Nacha
      states that an Originator or ODFI "must still transmit a Reversal in such
      time that it is made available to the RDFI within 5 banking days following
      the Settlement Date of the Erroneous Entry", and that the permissible
      reasons were expanded to cover wrong-date errors. So a settled ACH credit
      is final between banks and still reversible as an entry, which is the
      distinction that matters when someone asks whether ACH is final. What is
      not public is the full set of post-settlement rights in the Nacha
      Operating Rules, and that remainder is why this stays verified_partial.
    # The circular's URL carries its effective date, so an amendment is
    # published at a new path rather than rewriting this one underneath us. It
    # does not guarantee this file is ever removed, so the operating circulars
    # index is worth checking alongside it.
    source: https://www.frbservices.org/wp-content/uploads/010526-operating-circular-4.pdf
    verified_on: 2026-10-06

gaps:
  - field: standard_ach_transaction_limit
    reason: >-
      Widely repeated as "no per-transaction limit", but no primary Nacha or FRFS
      page reviewed states that explicitly. Recorded as unverified rather than
      asserted. If you need this for a design decision, read the Nacha Operating
      Rules directly or ask your ODFI in writing.
    narrowed_by: >-
      Two primary sentences get close without closing it. Nacha, at
      nacha.org/million, states that entries over $1,000,000 submitted to a
      same-day window "will not be rejected by the ACH Operator, but will be
      processed for next-day settlement in the next available processing
      window". The ACH Operator itself goes further and names a figure: in
      Example 6 of the FedACH Same Day ACH sample scenarios, linked below, a
      file carrying a single PPD debit entry for $1,025,500 is processed, and
      "the debit entry for $1,025,500, however, exceeds the $1,000,000 same day
      ACH entry limit, so it will settle the next day". So standard ACH
      demonstrably carries a specific entry above the same-day cap, stated by
      the operator rather than inferred. Neither sentence establishes that no
      limit exists, so the gap stands. Quote Example 6 and not Example 1 on
      that page: Example 1's setup says the large credit is $1,000,000 and its
      outcome calls the same entry $1,100,000, so it cannot be relied on.
    searched: https://www.frbservices.org/resources/financial-services/fedach-services-resources/ach-faq/same-day-ach-sample-scenarios-effective-march-18-2022/
