rail: rtp
display_name: RTP Network
operator: The Clearing House
jurisdiction: US
type: instant

facts:
  network_transaction_limit:
    value_usd: 10000000
    effective_from: 2025-02-09
    supersedes:
      value_usd: 1000000
      effective_from: 2022-04
    status: verified
    note: >-
      Quoted from the operator: "The new $10 million individual transaction limit
      will be effective February 9, 2025."
    source: https://www.theclearinghouse.org/payment-systems/Articles/2024/12/Higher_10_Million_RTP_Network_Transaction_Limit_Empowers_New_Uses_12-04-2024
    verified_on: 2026-10-06

  operating_hours:
    value: 24x7x365
    note: Includes bank holidays, weekends and after hours.
    status: verified
    source: https://www.theclearinghouse.org/payment-systems/rtp
    verified_on: 2026-10-06

  message_standard:
    value: ISO 20022
    version: null
    status: verified_partial
    source: https://www.theclearinghouse.org/payment-systems/rtp
    verified_on: 2026-10-06

  participants:
    value: 1378
    qualifier: "over"
    as_of: 2026-09
    supersedes:
      value: 1322
      qualifier: "over"
      as_of: 2026-07
    status: verified
    note: >-
      Operator-stated and moves faster than this file does. It was 1,280 as of
      June 2026, 1,322 as of July 2026 and 1,378 as of September 2026, so the
      monthly source check will always report this one late. Treat it as an
      order of magnitude, and read the operator page if the exact number
      matters.
    source: https://www.theclearinghouse.org/payment-systems/rtp
    verified_on: 2026-10-06

  settlement_finality:
    final_on_settlement: true
    irrevocable: true
    sender_may_cancel: false
    receiver_must_return_on_return_request: false
    return_request_response_deadline_banking_days: 10
    return_request_deadline_exceptions:
      - claimed fraud
      - breach of a Request for Payment warranty
    status: verified
    note: >-
      The operator publishes its rulebook, so this is the best documented of the
      four rails. Rule I.E: the RTP System "enables Participants to initiate
      credit transfers, receive final and irrevocable settlement for credit
      transfers, and make available to Receivers funds associated with such
      credit transfers in real-time". Rule III.E: "A Payment Message cannot be
      cancelled or amended by a Sending Participant once the Payment Message is
      sent by the Sending Participant to the RTP System", the single exception
      being a cancellation by the RTP System itself on a time out.
      Recourse runs on two separate tracks and they are easy to conflate. Rule
      VII.D is a Request for Return of Funds, which a participant may send for
      any reason, and VII.D.1 is explicit that the Receiving Participant "shall
      be under no obligation to return funds". It must answer within ten banking
      days, except where the request is sent for claimed fraud or for breach of
      a Request for Payment warranty, where VII.D.2 allows longer to
      investigate. Rule VII.C is a separate mechanism and the roles are easy to
      invert. Its claimant is the **Message Receiving Participant**, defined in
      the rules as the participant that receives a Payment-related Message, so
      in a Request for Payment flow that is the bank which received the request
      and sent the money, not the bank that received the money. It applies only
      where a Request for Payment warranty was breached, and it has a defined
      claims process with an arbitration proceeding under VII.C.7 if the two
      participants cannot agree.
      What this does NOT establish is that these two rules are the whole of
      anyone's recourse. Rules II.H and X.D address other rights and
      enforcement, and final settlement between banks does not displace
      consumer protections that may apply to the underlying customer.
    # The current rules, effective 2026-10-04. The URL names its effective date,
    # so an amendment is published at a new path rather than rewriting this text
    # underneath us. That does not guarantee this file is ever removed, so the
    # rules index is worth checking alongside it. Checked against the prior
    # 2022-06-10 version: all three rules carry the same wording, so this is
    # long-standing rather than new.
    source: https://www.theclearinghouse.org/-/media/New/TCH/Documents/Payment-Systems/RTP/RTP-Operating-Rules--Effective-October-4-2026.pdf
    verified_on: 2026-10-06
