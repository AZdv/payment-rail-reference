rail: fednow
display_name: FedNow Service
operator: Federal Reserve Financial Services
jurisdiction: US
type: instant

facts:
  network_transaction_limit:
    # Customer credit transfers and payment returns.
    value_usd: 10000000
    # Sender-side. The Operating Procedures apply this to pacs.008 messages
    # "originating from the RTN associated with a Participant Profile", and the
    # field is disabled outright for a Receive Only participant.
    customer_credit_transfer_default_usd: 100000
    effective_from: 2025-11-12
    supersedes:
      value_usd: 1000000
      # The 2025-09-05 press release is now the only live source for the step
      # up from $1,000,000, and it says only "November 2025".
      source: https://www.frbservices.org/news/press-releases/090525-fednow-transaction-limit-increase/
    participant_may_set_lower: true
    note: >-
      Financial institutions retain flexibility to set lower transaction limits
      based on internal risk parameters. The number that matters for a given
      integration is the sending institution's configured limit, not this one.
      The Operating Procedures give that configured limit a starting value: the
      Customer Credit Transfer limit "is defaulted to $100,000", and a
      participant has to raise it deliberately. So the institution to ask is the
      one sending, and a sender that never changed the default cannot put your
      $150,000 payment on a network whose ceiling is $10,000,000.
    status: verified_partial
    # Downgraded from verified on 2026-10-06, and the source replaced. The
    # $10,000,000 ceiling and the $100,000 default are stated plainly in the
    # FedNow Service Operating Procedures, section C, Network Limits. The
    # 2025-11-12 effective day is not stated on any live FRFS page. Its only
    # source, the FRFS customer communication of 12 November 2025, now returns
    # 404 and has been removed from the communications index altogether, so it
    # did not move, it was withdrawn. The day is kept because it was verified
    # against that page on 2026-08-10, not because it can be checked today.
    source: https://www.frbservices.org/wp-content/uploads/042826-fednow-service-operating-procedures.pdf
    verified_on: 2026-10-06

  liquidity_management_transfer_limit:
    # Recorded separately because the previous ceiling was NOT the same. Folding
    # both into one figure told anyone debugging a pre-November LMT that the old
    # limit was $1M when it was $2.5M, which is the exact error `supersedes`
    # exists to prevent.
    value_usd: 10000000
    lmt_default_usd: 2500000
    effective_from: 2025-11-12
    supersedes:
      value_usd: 2500000
    status: verified_partial
    # Downgraded from verified on 2026-10-06 for the same reason as the block
    # above: the 12 November 2025 customer communication was withdrawn from
    # frbservices.org. The $10,000,000 ceiling and the $2,500,000 default are
    # both stated in the Operating Procedures. The superseded $2,500,000
    # ceiling and the 2025-11-12 day are not, and there is a trap in what is
    # left. $2,500,000 is live today as the LMT default and was also the
    # pre-November ceiling, so anyone re-deriving this from the Operating
    # Procedures alone could read the default and conclude the supersedes
    # figure is a mistake. It is not. It just cannot be checked any more.
    source: https://www.frbservices.org/wp-content/uploads/042826-fednow-service-operating-procedures.pdf
    verified_on: 2026-10-06

  operating_hours:
    value: 24x7x365
    note: >-
      The instant payment message business day rolls at approximately 7:01 p.m. ET.
    status: verified
    # URL updated 2026-10-06; the old /fednow/operating-hours path 301s here.
    source: https://www.frbservices.org/resources/financial-services/fednow-service-resources/fednow-service-operating-hours/
    verified_on: 2026-10-06

  message_standard:
    value: ISO 20022
    version: null
    status: verified_partial
    note: >-
      The public FRFS pages reviewed state ISO 20022 but do not state a specific
      message set version. Recorded as unknown rather than guessed.
    # URL updated 2026-10-06; the old /what-is-iso-20022-why-does-it-matter
    # path 301s here.
    source: https://www.frbservices.org/financial-services/fednow-service/iso-20022-why-does-it-matter/
    verified_on: 2026-10-06

  settlement_finality:
    final_on_settlement: true
    final_at: the earlier of the FedNow Service recording the debits and credits and sending the Advice of Credit to the receiver
    operator_will_cancel_on_request: false
    status: verified
    note: >-
      Quoted from Operating Circular 8 section 7.1: "Settlement through the
      FedNow Service is final at the earlier of the time the FedNow Service
      records debits and credits in connection with a payment order sent through
      the FedNow Service and the FedNow Service sends an Advice of Credit to the
      FedNow Receiver." The same section adds that settlement is final
      regardless of whether the participant can yet see the entries or balance
      changes in its Settlement Account, which is the sentence that catches
      reconciliation logic built around a visible balance. Section 9.8.6 is the
      recourse half: notwithstanding section 4A-211 of Article 4A a Reserve Bank
      has no obligation to cancel or amend a payment order even when a
      participant asks, its only obligation is to forward the request, and
      whether the request works at all is left to 4A-211 between the two
      participants. There is no operator-level unwind to design against.
    # Dated URL, so an amendment 404s rather than changing silently. See the
    # same note on the ACH settlement_finality block.
    source: https://www.frbservices.org/wp-content/uploads/040126-operating-circular-8.pdf
    verified_on: 2026-10-06

gaps:
  - field: participant_count
    reason: >-
      FRFS publishes a participant list rather than a count, and any figure here
      would be stale within weeks. Read the list instead.
